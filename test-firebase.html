<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اختبار Firebase — SecurePath</title>
  <style>
    body { font-family: 'Cairo', sans-serif; padding: 40px; background: #0A1833; color: #fff; margin: 0; }
    .box { max-width: 700px; margin: auto; background: rgba(255,255,255,0.05); 
           padding: 30px; border-radius: 16px; border: 1px solid rgba(242,189,99,0.2); }
    h1 { color: #F2BD63; margin-bottom: 24px; }
    .item { padding: 12px 16px; margin: 8px 0; border-radius: 8px; 
            background: rgba(255,255,255,0.03); border-right: 3px solid #666; }
    .ok   { border-right-color: #4ade80; }
    .fail { border-right-color: #ef4444; }
    .label { font-weight: bold; color: #F2BD63; }
    .value { color: #cbd5e1; font-family: monospace; font-size: 13px; }
    #result { font-size: 18px; margin-top: 20px; padding: 20px; 
              border-radius: 12px; text-align: center; font-weight: bold; }
    .success { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
    .error   { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🔥 اختبار Firebase — SecurePath</h1>
    <div id="details"></div>
    <div id="result">جاري الفحص...</div>
  </div>

  <script type="module">
    import { app, auth, db, storage } from './js/firebase-init.js';

    const details = document.getElementById('details');
    const result  = document.getElementById('result');

    function addItem(label, value, ok = true) {
      const div = document.createElement('div');
      div.className = 'item ' + (ok ? 'ok' : 'fail');
      div.innerHTML = '<span class="label">' + label + ':</span> ' +
                      '<span class="value">' + value + '</span>';
      details.appendChild(div);
    }

    try {
      addItem('App Name', app.name, true);
      addItem('Project ID', app.options.projectId, true);
      addItem('Auth Domain', app.options.authDomain, true);
      addItem('Auth SDK', auth ? '✅ متصل' : '❌ فشل', !!auth);
      addItem('Firestore SDK', db ? '✅ متصل' : '❌ فشل', !!db);
      addItem('Storage SDK', storage ? '✅ متصل' : '❌ فشل', !!storage);
      addItem('Current User', auth.currentUser?.email || 'لا يوجد مستخدم مسجل', true);

      result.className = 'success';
      result.textContent = '✅ Firebase يعمل بنجاح — جاهز للمرحلة التالية';

    } catch (err) {
      console.error(err);
      addItem('خطأ', err.message, false);
      result.className = 'error';
      result.textContent = '❌ فشل الاتصال: ' + err.message;
    }
  </script>
</body>
</html>
