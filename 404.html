<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0E2A5C">
  <title>SecurePath — الصفحة غير موجودة</title>
  <style>
    :root{--navy:#0E2A5C;--deep:#071D40;--gold:#F2BD63;--paper:#F5F8FC;--muted:#718096}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#163E7A,#071D40 65%);font-family:Tajawal,"Segoe UI",sans-serif;color:#fff;padding:24px}.card{width:min(520px,100%);padding:42px 34px;border:1px solid rgba(255,255,255,.14);border-radius:28px;background:rgba(255,255,255,.08);backdrop-filter:blur(16px);text-align:center;box-shadow:0 28px 80px rgba(0,0,0,.3)}.logo{width:72px;height:72px;border-radius:20px;margin:auto auto 18px;display:block}.code{font:900 70px/1 "Plus Jakarta Sans","Segoe UI",sans-serif;color:var(--gold);letter-spacing:-4px}.card h1{margin:12px 0 8px;font-size:26px}.card p{margin:0;color:#D4E0EF;line-height:1.9;font-size:14px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:12px;font-weight:900;text-decoration:none}.primary{background:#fff;color:var(--navy)}.secondary{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.22)}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="./icon-192.png" alt="SecurePath">
    <div class="code">404</div>
    <h1>الصفحة غير موجودة</h1>
    <p>الرابط الذي فتحته غير متاح حاليًا. يمكنك العودة إلى SecurePath أو فتح التطبيق الرقمي مباشرة.</p>
    <div class="actions"><a class="btn primary" href="./">العودة للرئيسية</a><a class="btn secondary" href="./wathiqati-app.html">فتح التطبيق</a></div>
  </main>
</body>
</html>
