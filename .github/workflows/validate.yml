name: Validate Repository

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON files
        run: |
          set -e
          for f in $(find . -name "*.json" -not -path "./node_modules/*"); do
            echo "Checking $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || { echo "Invalid JSON: $f"; exit 1; }
          done
          echo "All JSON valid"

      - name: Check required files exist
        run: |
          set -e
          for f in LICENSE CHANGELOG.md manifest.json sw.js \
                   firestore.rules firestore.indexes.json; do
            [ -f "$f" ] || { echo "Missing required file: $f"; exit 1; }
          done
          echo "Required files present"

      - name: Verify Service Worker syntax
        run: node --check sw.js

      - name: Verify inline JavaScript in client app
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("wathiqati-app.html").read_text(encoding="utf-8")
          blocks = [x for x in re.findall(r"<script\\b[^>]*>([\\s\\S]*?)</script>", html, re.I) if x.strip()]
          Path("/tmp/securepath-inline.js").write_text("\n;\n".join(blocks), encoding="utf-8")
          print(f"Found {len(blocks)} inline script blocks")
          PY
          node --check /tmp/securepath-inline.js

      - name: Verify migration script syntax
        run: node --check securepath-firebase-migration.js

      - name: Verify SecurePath Worker syntax
        run: node --check workers/securepath-api/src/index.js

      - name: Verify SecurePath backend adapter syntax
        run: node --check js/securepath-backend.js

      - name: Lint landing HTML
        run: |
          npx --yes htmlhint "index.html" --config .htmlhintrc

      - name: Check changed files for whitespace errors
        run: git diff --check
