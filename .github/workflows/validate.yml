name: Validate Repository

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON files
        run: |
          set -e
          for f in $(find . -name "*.json" -not -path "./node_modules/*"); do
            echo "Checking $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" \
              || { echo "Invalid JSON: $f"; exit 1; }
          done
          echo "All JSON valid"

      - name: Check required files exist
        run: |
          set -e
          for f in LICENSE CHANGELOG.md manifest.json sw.js \
                   firestore.rules firestore.indexes.json; do
            [ -f "$f" ] || { echo "Missing required file: $f"; exit 1; }
          done
          echo "Required files present"

      - name: Verify Service Worker syntax
        run: node --check sw.js

      - name: Verify migration script syntax
        run: node --check securepath-firebase-migration.js || true

      - name: Lint HTML (basic)
        run: |
          npx --yes htmlhint "*.html" --config .htmlhintrc || true
